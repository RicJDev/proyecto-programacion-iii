name: proyecto-programacion-iii

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-vacunas}
      MARIADB_USER: ${DB_USER:-vacunas}
      MARIADB_PASSWORD: ${DB_PASSWORD:-vacunas}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vacunas}
      DB_USER: ${DB_USER:-vacunas}
      DB_PASSWORD: ${DB_PASSWORD:-vacunas}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./app/backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  backend_node_modules:
