name: proyecto-sinacimn

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MARIADB_DATABASE: ${DB_NAME:-vacunas}
      MARIADB_USER: ${DB_USER:-vacunas}
      MARIADB_PASSWORD: ${DB_PASSWORD:-vacunas}
      MARIADB_USER_HOST: ${DB_HOST:-localhost}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: ${DB_HOST:-localhost}
      PMA_PORT: ${DB_PORT:-3306}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:-64M}
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_HOST: ${BACKEND_HOST:-localhost}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      DB_USER: ${DB_USER:-vacunas}
      DB_PASSWORD: ${DB_PASSWORD:-vacunas}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-vacunas}
      DB_URL: mysql://${DB_USER}:${DB_PASSWORD}@{DB_HOST}:${DB_PORT}/${DB_NAME}
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    depends_on:
      db:
        condition: service_healthy

  panel:
    build:
      context: .
      dockerfile: ./app/panel/Dockerfile
    restart: unless-stopped
    ports:
      - '${PANEL_PORT:-8081}:80'
    depends_on:
      - backend

  tu-tarjeta:
    build:
      context: .
      dockerfile: ./app/tu-tarjeta/Dockerfile
    restart: unless-stopped
    ports:
      - '${TUTARJETA_PORT:-8082}:80'
    depends_on:
      - backend

volumes:
  db_data:
